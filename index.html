<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Študenti</title>

<style>
body {
    font-family: "Comic Sans MS", cursive, sans-serif;
    text-align: center;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;

    background: linear-gradient(
        -45deg,
        #0b1026,   /* tmavomodrá */
        #1b0f3a,   /* tmavofialová */
        #0a1f44,   /* deep blue */
        #2a0f4a    /* purple */
    );

    background-size: 400% 400%;
    animation: spaceGradient 18s ease infinite;
}

@keyframes skyMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 🌟 STARS */
.stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite ease-in-out;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.8); }
}

/* CONTENT */
h1 {
    margin: 20px;
    color: white;
    position: relative;
    z-index: 1;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 1;
}

/* 🧊 GLASS CARDS */
.card {
    position: relative;
    overflow: hidden;

    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    width: 220px;
    margin: 10px;
    padding: 10px;
    border-radius: 15px;

    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);

    color: white;

    transform: translateY(20px);
    opacity: 0;
    transition: all 0.6s ease;

    cursor: pointer;
}

.card.reveal {
    transform: translateY(0);
    opacity: 1;
}

/* ✨ SHINE */
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;

    background: linear-gradient(
        120deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.35) 50%,
        rgba(255,255,255,0) 100%
    );

    transform: skewX(-25deg);
}

.card.reveal::before {
    animation: shine 0.8s ease;
}

@keyframes shine {
    0% { left: -75%; }
    100% { left: 125%; }
}

.card:hover {
    transform: translateY(-5px) scale(1.05);
}

img {
    width: 100%;
    border-radius: 10px;
}

/* BUTTON */
button {
    padding: 10px 20px;
    margin: 15px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

/* 💬 CHAT */
#chatModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);

    justify-content: center;
    align-items: center;

    opacity: 0;
    transition: opacity 0.3s ease;

    z-index: 2;
}

#chatBox {
    background: rgba(255, 255, 255, 0.95);
    width: 400px;
    padding: 20px;
    border-radius: 15px;

    transform: scale(0.7);
    opacity: 0;
    transition: all 0.3s ease;

    text-align: left;
}

#chatModal.active {
    display: flex;
    opacity: 1;
}

#chatModal.active #chatBox {
    transform: scale(1);
    opacity: 1;
}

#chatMessages {
    height: 200px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="stars"></div>

<h1>Zoznam študentov</h1>

<button onclick="loadStudents()">Načítať študentov</button>

<div class="container" id="students"></div>

<!-- CHAT -->
<div id="chatModal">
    <div id="chatBox">
        <h2 id="chatTitle"></h2>

        <div id="chatMessages"></div>

        <input id="chatInput" placeholder="Napíš správu..." style="width:70%;">
        <button onclick="sendMessage()">Odoslať</button>
        <button onclick="closeChat()">Zavrieť</button>
    </div>
</div>

<script>
const API_URL = "https://backend-8lo7.onrender.com/api";
const CHAT_URL = "https://backend-8lo7.onrender.com/chat";

let currentStudent = null;

/* ⭐ STARS */
function createStars() {
    const starsContainer = document.querySelector(".stars");

    for (let i = 0; i < 80; i++) {
        const star = document.createElement("div");
        star.className = "star";

        star.style.top = Math.random() * 100 + "%";
        star.style.left = Math.random() * 100 + "%";
        star.style.animationDelay = Math.random() * 2 + "s";

        starsContainer.appendChild(star);
    }
}
createStars();

/* 📦 LOAD STUDENTS */
async function loadStudents() {
    const container = document.getElementById("students");
    container.innerHTML = "⏳ Načítavam...";

    const response = await fetch(API_URL);
    const data = await response.json();

    container.innerHTML = "";

    data.students.forEach(student => {
        const div = document.createElement("div");
        div.className = "card";

        div.onclick = () => openChat(student);

        div.innerHTML = `
            <img src="${student.image}" onerror="this.src='https://via.placeholder.com/220x150'">
            <h3>${student.name} ${student.surname}</h3>
            <p>${student.nickname || "-"}</p>
        `;

        container.appendChild(div);
    });

    observeCards();
}

/* ✨ SCROLL REVEAL */
function observeCards() {
    const cards = document.querySelectorAll(".card");

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("reveal");
            }
        });
    }, { threshold: 0.2 });

    cards.forEach(card => observer.observe(card));
}

/* 💬 CHAT */
function openChat(student) {
    currentStudent = student;

    const modal = document.getElementById("chatModal");
    modal.style.display = "flex";

    setTimeout(() => modal.classList.add("active"), 10);

    document.getElementById("chatTitle").innerText =
        `Chat s ${student.name}`;

    document.getElementById("chatMessages").innerHTML = "";
}

function closeChat() {
    const modal = document.getElementById("chatModal");

    modal.classList.remove("active");

    setTimeout(() => {
        modal.style.display = "none";
    }, 300);
}

function addMessage(sender, text) {
    const chat = document.getElementById("chatMessages");
    const msg = document.createElement("div");

    msg.innerHTML = `<b>${sender}:</b> ${text}`;
    chat.appendChild(msg);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById("chatInput");
    const text = input.value;
    if (!text) return;

    addMessage("Ty", text);
    input.value = "";

    const response = await fetch(CHAT_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            message: text,
            name: currentStudent.name,
            personality: currentStudent.personality
        })
    });

    const data = await response.json();

    addMessage(currentStudent.name, data.reply || "❌ chyba");
}
</script>

</body>
</html>
